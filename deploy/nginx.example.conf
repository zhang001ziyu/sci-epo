# Template: HTTPS in front of Sci-epo on the same host. Replace studio.example.com.
# Put this file in /etc/nginx/conf.d/ (http context) and issue the certificate with certbot.
limit_req_zone $binary_remote_addr zone=sciepo_login:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=sciepo_api:1m rate=90r/m;

server {
    listen 80;
    listen [::]:80;
    server_name studio.example.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name studio.example.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/studio.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studio.example.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 300k;
    limit_req_status 429;

    # Shared proxy settings. A full review can run for hours in the worst case,
    # so the read timeout covers the longest bounded review the server allows.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_redirect off;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 20460s;
    proxy_send_timeout 20460s;

    location = /api/auth/login {
        limit_req zone=sciepo_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:4317;
    }
    # Media uploads: rendered takes from a session's worker (videos up to 64 MB), and references and music from the
    # owner (up to 30 MB). Sci-epo checks each kind's own limit while it reads the body.
    location ~ ^/api/worker/v1/takes/ {
        client_max_body_size 64m;
        proxy_request_buffering off;
        limit_req zone=sciepo_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:4317;
    }
    location ~ ^/api/projects/[^/]+/media$ {
        client_max_body_size 30m;
        proxy_request_buffering off;
        limit_req zone=sciepo_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:4317;
    }
    location / {
        limit_req zone=sciepo_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:4317;
    }
}
